name: Update F1 championship data

on:
  workflow_dispatch:
  schedule:
    # Saturday and Sunday: check every 15 minutes so Sprint/GP results publish quickly.
    - cron: '*/15 * * * 0,6'
    # Thursday and Friday: hourly while race weekends are getting underway.
    - cron: '17 * * * 4,5'
    # Monday through Wednesday: one maintenance/freshness check per day.
    - cron: '17 6 * * 1-3'

permissions:
  contents: write

concurrency:
  group: f1-championship-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh completed F1 results and standings
        run: python scripts/update_f1_data.py

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/season-2026.json; then
            echo "No F1 data change to commit."
            exit 0
          fi
          git config user.name "f1-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/season-2026.json
          git commit -m "Update 2026 F1 standings snapshot"
          git push
